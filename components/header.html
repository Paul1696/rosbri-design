<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-line transition-all duration-300">
  <div class="max-w-[1440px] mx-auto px-6 lg:px-8 py-5 min-h-[88px] flex items-center justify-between gap-6">
    <!-- Logo & Marque -->
    <a href="index.html" class="flex items-center gap-4 group flex-shrink-0" aria-label="ROSBRI DESIGN - Accueil">
      <img src="images/brand/rosbri-wax-design-logo.jpg" alt="ROSBRI DESIGN" class="h-10 md:h-12 w-auto rounded-lg shadow-sm group-hover:scale-105 transition-transform duration-300">
      <div class="flex flex-col">
        <span class="font-display-accent text-2xl font-bold text-ink leading-tight tracking-tight">ROSBRI DESIGN</span>
        <span class="text-[10px] uppercase tracking-[0.22em] font-bold text-champagne">Afritude Luxe</span>
      </div>
    </a>

    <!-- Navigation Desktop -->
    <nav class="hidden lg:flex items-center gap-8 lg:gap-10 font-label-sm uppercase tracking-widest text-[13px] font-bold text-ink/80" aria-label="Navigation principale">
      <a href="index.html" data-nav-link="index.html" class="header-nav-link">Accueil</a>
      <a href="boutique.html" data-nav-link="boutique.html" class="header-nav-link">Boutique</a>
      <a href="collections.html" data-nav-link="collections.html" class="header-nav-link">Collections</a>
      <a href="a_propos.html" data-nav-link="a_propos.html" class="header-nav-link">À Propos</a>
      <a href="boutique.html?categorie=Entreprise" data-nav-link="b2b" class="header-nav-link">B2B</a>
    </nav>

    <!-- Header Actions (Recherche, Panier, Mobile Menu) -->
    <div class="flex items-center gap-4 md:gap-5">
      <!-- Formulaire de recherche -->
      <form id="header-search-form" action="boutique.html" method="GET" class="hidden sm:flex items-center relative w-48 md:w-[280px]">
        <input type="text" name="recherche" id="header-search-input" placeholder="Rechercher un produit..." class="w-full pl-10 pr-5 py-2.5 text-[13px] rounded-full border border-line bg-surface-container-low text-ink placeholder:text-muted focus:outline-none focus:border-champagne focus:bg-white transition-all">
        <button type="submit" aria-label="Lancer la recherche" class="absolute left-3 text-muted hover:text-ink flex items-center justify-center">
          <span class="material-symbols-outlined text-base">search</span>
        </button>
      </form>

      <!-- Bouton Panier -->
      <button data-open-cart class="relative text-ink hover:text-champagne transition-colors flex items-center justify-center rounded-full hover:bg-surface-container-low min-w-[44px] min-h-[44px]" type="button" aria-label="Voir mon panier">
        <span class="material-symbols-outlined text-[26px]">shopping_bag</span>
        <span id="cart-count-badge" class="cart-count-badge absolute top-0 right-0 bg-champagne text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold shadow-sm" style="display:none;">0</span>
      </button>

      <!-- Bouton Menu Mobile -->
      <button data-toggle-mobile-menu class="lg:hidden text-ink hover:text-champagne transition-colors flex items-center justify-center rounded-full hover:bg-surface-container-low min-w-[44px] min-h-[44px]" type="button" aria-label="Ouvrir le menu mobile">
        <span class="material-symbols-outlined text-[26px]">menu</span>
      </button>
    </div>
  </div>
</header>
