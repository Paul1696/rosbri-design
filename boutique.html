<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Boutique Afritude Luxe | ROSBRI DESIGN</title>
  <meta name="description" content="Explorez le catalogue complet des collections ROSBRI DESIGN : T-shirts Héritage, sacs Wax, ensembles enfants, babouches et coffrets cadeaux personnalisés."/>
  <meta property="og:title" content="Boutique Afritude Luxe | ROSBRI DESIGN"/>
  <meta property="og:description" content="Découvrez nos pièces d'exception façonnées à la main. Choisissez votre style, vos tailles et personnalisez votre commande."/>
  <meta property="og:image" content="images/brand/rosbri-wax-design-logo.jpg"/>
  <meta property="og:url" content="https://rosbridesign.ateliersdepaul.com/boutique.html"/>
  <meta property="og:type" content="website"/>

  <!-- Shared Tailwind Config & CDN -->
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Design System Styles -->
  <link rel="stylesheet" href="css/tokens.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body class="bg-cream text-ink font-body-md antialiased overflow-x-hidden selection:bg-champagne selection:text-white boutique-page">

  <!-- Mount Points -->
  <div id="site-announcement"></div>
  <div id="site-header"></div>

  <main id="main-content" class="max-w-[1720px] mx-auto px-6 py-8 flex flex-col md:flex-row gap-8">
    <!-- Mobile Filter Backdrop -->
    <div id="mobile-filter-backdrop" class="fixed inset-0 bg-ink/50 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

    <!-- Sidebar Filter (Desktop) & Mobile Drawer -->
    <aside id="mobile-filter-drawer" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 md:w-72 md:bg-transparent md:shadow-none md:z-0 flex-shrink-0 flex flex-col md:block h-full md:h-auto overflow-hidden md:overflow-visible">
      <div class="flex-grow md:flex-none overflow-y-auto md:overflow-visible p-6 md:p-0 md:sticky md:top-24 space-y-6 flex flex-col md:block">
        <!-- Mobile Header -->
        <div class="flex items-center justify-between md:hidden pb-4 border-b border-line">
          <h2 class="font-bold text-lg text-ink">Filtres Catalogue</h2>
          <button id="close-mobile-filters" class="p-2 text-muted hover:text-ink" aria-label="Fermer les filtres"><span class="material-symbols-outlined">close</span></button>
        </div>

        <!-- Search Component -->
        <div class="relative flex-shrink-0">
          <input id="catalog-search" class="w-full bg-white border border-line rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-champagne text-xs text-ink placeholder:text-muted" placeholder="Rechercher un produit..." type="text"/>
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm">search</span>
        </div>

        <!-- Dynamic Categories -->
        <div id="filter-list" class="space-y-2 flex-grow"></div>

        <!-- Mobile Bottom Buttons -->
        <div class="md:hidden pt-4 border-t border-line space-y-3 flex-shrink-0 mt-4">
          <button id="apply-mobile-filters" class="w-full bg-ink text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-champagne transition-colors">Afficher les résultats</button>
          <button id="reset-mobile-filters" class="w-full bg-surface-variant text-ink py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-line transition-colors">Réinitialiser</button>
        </div>
      </div>
    </aside>

    <!-- Product Grid Area -->
    <div class="flex-grow">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-6 gap-4">
        <div>
          <h1 class="font-display-accent text-3xl md:text-4xl text-ink font-bold">Boutique ROSBRI DESIGN</h1>
          <p id="result-count" class="text-xs text-muted mt-1">Chargement du catalogue...</p>
        </div>

        <!-- Desktop Sort -->
        <div class="hidden md:flex items-center gap-2">
          <span class="text-xs text-muted uppercase tracking-wider font-bold">Trier par:</span>
          <select id="catalog-sort" class="bg-white border border-line rounded-xl px-3 py-2 text-xs font-bold text-ink focus:outline-none focus:border-champagne cursor-pointer">
            <option value="default">Plus récents</option>
            <option value="price">Prix croissant</option>
            <option value="name">Nom (A-Z)</option>
            <option value="category">Par catégorie</option>
          </select>
        </div>
      </div>

      <!-- Mobile Toolbar -->
      <div class="flex items-center justify-between gap-3 mb-6 md:hidden">
        <button id="open-mobile-filters" class="flex-1 flex items-center justify-center gap-2 bg-white border border-line py-2.5 rounded-xl font-bold text-xs uppercase text-ink shadow-sm">
          <span class="material-symbols-outlined text-sm">tune</span> Filtres
        </button>
        <div class="flex-1 bg-white border border-line rounded-xl px-2 flex items-center shadow-sm">
          <span class="material-symbols-outlined text-muted text-sm ml-2">sort</span>
          <select id="catalog-sort-mobile" class="w-full bg-transparent border-none font-bold text-ink py-2.5 focus:ring-0 cursor-pointer text-xs">
            <option value="default">Récents</option>
            <option value="price">Prix</option>
            <option value="name">A-Z</option>
            <option value="category">Catégories</option>
          </select>
        </div>
      </div>

      <!-- Grid Responsive (5 cols xl, 4 lg, 3 md, 2 sm, 1 mobile) -->
      <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
        <!-- Injected dynamically by catalog.js -->
      </div>

      <!-- Pagination / Load More -->
      <div class="mt-12 flex justify-center items-center">
        <button id="catalog-load-more" class="px-8 py-3 rounded-full border border-line bg-white text-ink hover:bg-ink hover:text-white transition-all font-bold text-xs uppercase tracking-widest shadow-sm" style="display: none;">Charger plus d'articles</button>
      </div>
    </div>
  </main>

  <!-- Mount Points -->
  <div id="site-footer"></div>
  <div id="site-mobile-menu"></div>
  <div id="site-cart-drawer"></div>

  <!-- Shared Scripts in Canonical Order -->
  <script src="catalog-data.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/header.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/mobile-menu.js" defer></script>
  <script src="js/announcement-bar.js" defer></script>
  <script src="js/qa-check.js" defer></script>
</body>
</html>
